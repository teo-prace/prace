name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # 1. Compila e roda os testes (em todo push e pull request)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet test Portfolio.slnx -c Release

  # 2. Gera a imagem Docker e publica no GitHub Container Registry (só na main)
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: docker build -t "${{ steps.name.outputs.image }}" -t "ghcr.io/${GITHUB_REPOSITORY,,}:latest" .

      # Contêiner local e testa antes de publicar.
      - name: Smoke test do contêiner
        run: |
          docker run -d --name smoke -p 8080:8080 "${{ steps.name.outputs.image }}"
          bash .github/scripts/smoke.sh http://localhost:8080 12 || { docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Publicar
        run: docker push --all-tags "ghcr.io/${GITHUB_REPOSITORY,,}"

  # 3. Atualiza o site no Azure (só roda depois de configurar o Azure; veja docs/azure.md)
  deploy:
    needs: image
    if: vars.AZURE_CONTAINERAPP_NAME != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production
    env:
      APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      # Endereço público testado depois do deploy (variável SITE_URL no GitHub; padrão prace.dev).
      SITE_URL: ${{ vars.SITE_URL || 'https://prace.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Guarda a versão que está no ar, para poder voltar.
      - name: Versão atual
        id: current
        run: echo "image=$(az containerapp show -n "$APP" -g "$RG" --query 'properties.template.containers[0].image' -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: az containerapp update -n "$APP" -g "$RG" --image "${{ needs.image.outputs.image }}" -o none

      # Testa o site. Até ~2 minutos para a versão nova assumir.
      - name: Smoke test em produção
        run: bash .github/scripts/smoke.sh "$SITE_URL" 12

      # Se teste falhou, volta para a versão anterior.
      - name: Rollback
        if: failure() && steps.current.outputs.image != ''
        run: |
          echo "Voltando para ${{ steps.current.outputs.image }}"
          az containerapp update -n "$APP" -g "$RG" --image "${{ steps.current.outputs.image }}" -o none
          bash .github/scripts/smoke.sh "$SITE_URL" 12
