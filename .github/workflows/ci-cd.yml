name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # 1. Compila e roda os testes (em todo push e pull request)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet test Portfolio.slnx -c Release

  # 2. Gera a imagem Docker e publica no GitHub Container Registry (só na main)
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t "${{ steps.name.outputs.image }}" -t "ghcr.io/${GITHUB_REPOSITORY,,}:latest" .
          docker push --all-tags "ghcr.io/${GITHUB_REPOSITORY,,}"

  # 3. Atualiza o site no Azure (só roda depois de configurar o Azure; veja docs/azure.md)
  deploy:
    needs: image
    if: vars.AZURE_CONTAINERAPP_NAME != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.image.outputs.image }}"
